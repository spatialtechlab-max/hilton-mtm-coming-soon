<!DOCTYPE html>
<!-- build: redeploy after public visibility -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>House of Bespoke — Coming Soon to KSA</title>
<meta name="description" content="House of Bespoke — luxury bespoke men's tailoring. Coming soon to the Kingdom of Saudi Arabia." />

<!-- Open Graph / social preview -->
<meta property="og:title" content="House of Bespoke — Coming Soon to KSA" />
<meta property="og:description" content="Luxury bespoke men's tailoring. Coming soon to the Kingdom of Saudi Arabia." />
<meta property="og:type" content="website" />
<meta property="og:image" content="assets/logo.png" />

<link rel="icon" type="image/png" href="assets/logo.png" />

<!-- Fonts (self-hosted — no external dependency) -->
<link href="assets/fonts/fonts.css" rel="stylesheet" />

<style>
  :root {
    /* Palette sampled from the House of Bespoke crest */
    --green-deep:  #06231d;
    --green:       #0c3a30;
    --green-soft:  #135043;
    --gold:        #d8b878;
    --gold-bright: #f0d9a4;
    --gold-deep:   #b08d4f;
    --ink:         #eef1ea;

    }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { max-width: 100%; overflow-x: hidden; }

  body {
    font-family: "Montserrat", -apple-system, system-ui, sans-serif;
    color: var(--ink);
    background: var(--green-deep);
    min-height: 100svh;
    display: flex;
    /* Center with auto margins on the child (see .frame) rather than
       justify/align-center, so when content is taller than the viewport it
       stays scrollable and the top never gets clipped. */
    padding: clamp(1.5rem, 4vh, 3rem) 0;
    box-sizing: border-box;
    overflow-x: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ---------- Layered luxury background ---------- */

  /* Blurred bespoke-tailoring photography — two layers slowly crossfade */
  .bg-photo {
    position: fixed; inset: 0;
    background-size: cover;
    background-position: center;
    filter: blur(20px) saturate(0.7) brightness(0.46) contrast(1.05);
    will-change: opacity, transform;
    transform: scale(1.16);
  }
  /* Single blurred backdrop — DSCF5034 */
  #bgA { background-image: url("assets/hero-2.jpg"); z-index: -3; animation: kb 46s ease-in-out infinite alternate; }
  @keyframes kb {
    from { transform: scale(1.14) translate(0, 0); }
    to   { transform: scale(1.24) translate(-1.5%, -1.5%); }
  }

  /* Deep emerald tint over the photography — keeps it on-brand & text legible */
  .bg-gradient {
    position: fixed; inset: 0;
    background:
      radial-gradient(120% 95% at 50% 6%,
        rgba(19,80,67,0.50) 0%,
        rgba(12,58,48,0.70) 38%,
        rgba(6,35,29,0.88) 80%);
    z-index: -2;
  }

  /* Fine tailoring pinstripe + soft vignette */
  .bg-texture {
    position: fixed; inset: 0;
    background-image:
      repeating-linear-gradient(
        45deg,
        rgba(216,184,120,0.035) 0px,
        rgba(216,184,120,0.035) 1px,
        transparent 1px,
        transparent 9px
      ),
      radial-gradient(140% 120% at 50% 50%, transparent 52%, rgba(0,0,0,0.55) 100%);
    z-index: -1;
    pointer-events: none;
  }

  /* ---------- Content ---------- */

  .frame {
    width: min(92vw, 860px);
    margin: auto; /* safe centering — collapses to 0 when content overflows */
    padding: clamp(2.4rem, 6vw, 4.5rem) clamp(1.6rem, 5vw, 3.5rem);
    text-align: center;
    position: relative;
  }

  /* thin gold inner border frame */
  .frame::before {
    content: "";
    position: absolute; inset: 0;
    border: 1px solid rgba(216,184,120,0.28);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.25) inset;
    pointer-events: none;
  }
  .frame::after {
    content: "";
    position: absolute; inset: 10px;
    border: 1px solid rgba(216,184,120,0.12);
    pointer-events: none;
  }

  /* Logo medallion */
  .medallion {
    width: clamp(150px, 24vw, 208px);
    height: clamp(150px, 24vw, 208px);
    margin: 0 auto clamp(1.4rem, 3vw, 2rem);
    border-radius: 50%;
    overflow: hidden;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(216,184,120,0.55),
      0 0 0 7px rgba(6,35,29,0.85),
      0 0 0 8px rgba(216,184,120,0.35),
      0 26px 60px rgba(0,0,0,0.55);
    background: var(--green);
  }
  .medallion img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transform: scale(1.02);
  }

  .tagline {
    font-family: "Montserrat", sans-serif;
    font-weight: 400;
    font-size: clamp(0.62rem, 1.7vw, 0.78rem);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: clamp(1.6rem, 4vw, 2.4rem);
    padding-left: 0.42em; /* optical centering for tracked caps */
  }

  .headline {
    font-family: "Cormorant Garamond", serif;
    font-weight: 500;
    /* Roomy line-height + padding so descenders (the "g") stay inside the
       gradient text box — otherwise -webkit-background-clip:text leaves the
       tail unfilled and it looks cut off. */
    line-height: 1.18;
    padding-bottom: 0.12em;
    font-size: clamp(2.9rem, 11vw, 6rem);
    letter-spacing: 0.01em;
    background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 48%, var(--gold-deep) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    position: relative;
  }
  .headline .shine {
    position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 38%, rgba(255,255,255,0.55) 50%, transparent 62%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    background-size: 250% 100%;
    animation: shimmer 6.5s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%   { background-position: 140% 0; }
    55%  { background-position: -40% 0; }
    100% { background-position: -40% 0; }
  }

  .subhead {
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.15rem, 3.4vw, 1.7rem);
    color: var(--ink);
    opacity: 0.9;
    margin-top: clamp(0.6rem, 1.6vw, 0.9rem);
  }

  /* Ornamental gold divider */
  .divider {
    display: flex; align-items: center; justify-content: center;
    gap: 0.9rem;
    margin: clamp(1.8rem, 4.5vw, 2.6rem) auto clamp(1.4rem, 3.5vw, 2rem);
    width: min(80%, 340px);
  }
  .divider .line {
    height: 1px; flex: 1;
    background: linear-gradient(90deg, transparent, var(--gold-deep), transparent);
  }
  .divider .diamond {
    width: 7px; height: 7px;
    transform: rotate(45deg);
    background: var(--gold);
    box-shadow: 0 0 10px rgba(216,184,120,0.5);
  }

  .location {
    font-family: "Montserrat", sans-serif;
    font-weight: 300;
    font-size: clamp(0.78rem, 2vw, 0.95rem);
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink);
    opacity: 0.82;
    padding-left: 0.28em;
  }

  /* Contact */
  .contact {
    margin-top: clamp(1.8rem, 4vw, 2.6rem);
    display: flex;
    flex-wrap: wrap;
    gap: 0.9rem 1.4rem;
    align-items: center;
    justify-content: center;
  }
  .contact a {
    text-decoration: none;
    color: var(--gold-bright);
    font-family: "Montserrat", sans-serif;
    font-weight: 400;
    font-size: 0.8rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    padding: 0.85em 1.7em;
    border: 1px solid rgba(216,184,120,0.4);
    border-radius: 2px;
    transition: all 0.4s ease;
    position: relative;
    overflow: hidden;
  }
  .contact a:hover {
    color: var(--green-deep);
    background: var(--gold);
    border-color: var(--gold);
    box-shadow: 0 10px 30px rgba(216,184,120,0.25);
  }
  .contact a.ghost {
    border-color: rgba(216,184,120,0.22);
    color: var(--gold);
  }
  .contact a svg {
    width: 0.95em; height: 0.95em;
    vertical-align: -0.13em;
    margin-right: 0.55em;
  }

  .footnote {
    margin-top: clamp(2.4rem, 5vw, 3.4rem);
    font-family: "Montserrat", sans-serif;
    font-weight: 300;
    font-size: 0.64rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(238,241,234,0.42);
    padding-left: 0.22em;
  }

  /* ---------- Entrance choreography ---------- */
  .reveal { opacity: 0; transform: translateY(18px); animation: rise 1.1s cubic-bezier(.2,.7,.2,1) forwards; }
  .medallion.reveal { transform: translateY(0) scale(0.9); animation: pop 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: 0.15s; }
  .d2 { animation-delay: 0.45s; }
  .d3 { animation-delay: 0.70s; }
  .d4 { animation-delay: 0.95s; }
  .d5 { animation-delay: 1.15s; }
  .d6 { animation-delay: 1.35s; }
  .d7 { animation-delay: 1.55s; }

  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  @keyframes pop  { to { opacity: 1; transform: translateY(0) scale(1); } }

  @media (prefers-reduced-motion: reduce) {
    .reveal, .medallion.reveal { opacity: 1; transform: none; animation: none; }
    .headline .shine { animation: none; }
    #bgA { animation: none; opacity: 1; }
  }

  /* ---------- Small screens ---------- */
  @media (max-width: 560px) {
    .frame { width: 100vw; max-width: 100%; padding: 2.6rem 1.4rem; }
    .frame::before, .frame::after { display: none; }
    .headline { font-size: clamp(2rem, 11vw, 3rem); letter-spacing: 0; }
    .tagline { font-size: 0.6rem; letter-spacing: 0.26em; padding-left: 0.26em; }
    .location { font-size: 0.72rem; letter-spacing: 0.16em; padding-left: 0.16em; line-height: 1.8; }
    .contact { flex-direction: column; gap: 0.8rem; }
    .contact a { width: 100%; max-width: 280px; text-align: center; }
  }

  /* ---------- Short viewports (laptops / landscape) — compress to fit ---------- */
  @media (max-height: 780px) {
    .frame { padding-top: 1.6rem; padding-bottom: 1.6rem; }
    .medallion { width: clamp(108px, 16vh, 150px); height: clamp(108px, 16vh, 150px); margin-bottom: 1.1rem; }
    .tagline { margin-bottom: 1.1rem; }
    .headline { font-size: clamp(2.4rem, 9vh, 4.6rem); }
    .subhead { font-size: clamp(1rem, 2.6vh, 1.5rem); }
    .divider { margin: 1.1rem auto 0.9rem; }
    .location { margin-top: 0; }
    .contact { margin-top: 1.3rem; }
    .footnote { margin-top: 1.5rem; }
  }
</style>
</head>
<body>
  <div class="bg-photo" id="bgA"></div>
  <div class="bg-gradient"></div>
  <div class="bg-texture"></div>

  <main class="frame">
    <div class="medallion reveal d1">
      <img src="assets/logo.png" alt="House of Bespoke crest" />
    </div>

    <p class="tagline reveal d2">Luxury Bespoke Men's Tailoring</p>

    <h1 class="headline reveal d3">
      Coming Soon
      <span class="shine" aria-hidden="true">Coming Soon</span>
    </h1>
    <p class="subhead reveal d4">to the Kingdom of Saudi Arabia</p>

    <div class="divider reveal d5">
      <span class="line"></span>
      <span class="diamond"></span>
      <span class="line"></span>
    </div>

    <p class="location reveal d5">Al Khobar &nbsp;·&nbsp; Kingdom of Saudi Arabia</p>

    <div class="contact reveal d6">
      <a href="tel:+966544255624">+966 54 425 5624</a>
      <a class="ghost" href="https://wa.me/966544255624" target="_blank" rel="noopener">WhatsApp</a>
      <a class="ghost" href="https://www.instagram.com/houseofbespoke_ksa" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.4" ry="5.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="4.4" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="17.4" cy="6.6" r="1.25" fill="currentColor"/>
        </svg>
        Instagram
      </a>
    </div>

    <p class="footnote reveal d7">@houseofbespoke_ksa &nbsp;·&nbsp; Al Khobar, KSA</p>
  </main>
</body>
</html>
